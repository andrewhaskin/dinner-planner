<style>
:root{
  --bg:#EEF3EC;--surface:#FFFFFF;--ink:#18261F;--muted:#5C6D63;--line:#D3DDD4;--chip:#E1EADF;
  --leaf:#2F6B4F;--sky:#2B6C99;--accent-ink:#FFFFFF;--tomato:#C9402E;--butter:#F4C443;--butter-ink:#2A2108;--plum:#7A4E8C;--amber:#B56E0C;
  --basil:var(--leaf);--basil-ink:var(--accent-ink);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111915;--surface:#1A251F;--ink:#E7EFE9;--muted:#9AABA1;--line:#2B3A32;--chip:#24332B;
    --leaf:#62B389;--sky:#74B7E3;--accent-ink:#0D1712;--tomato:#F0705C;--plum:#C298D4;--amber:#F0A847;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111915;--surface:#1A251F;--ink:#E7EFE9;--muted:#9AABA1;--line:#2B3A32;--chip:#24332B;
  --leaf:#62B389;--sky:#74B7E3;--accent-ink:#0D1712;--tomato:#F0705C;--plum:#C298D4;--amber:#F0A847;
  color-scheme:dark;
}
body[data-mode="lunch"]{--basil:var(--sky)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
h1,h2,.display{font-family:"Bricolage Grotesque",system-ui,-apple-system,sans-serif;letter-spacing:-.015em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--basil);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:12px 16px 160px}
.title{font-size:32px;font-weight:800;margin:10px 0 14px;line-height:1.05}
.hint{color:var(--muted);font-size:15px;margin:8px 0}
.lbl{display:block;font-weight:700;font-size:15px;margin:18px 0 6px}
input,textarea,select{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
textarea{resize:vertical;line-height:1.4}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 18px;border-radius:14px;border:1px solid var(--basil);background:var(--basil);color:var(--basil-ink);font-weight:700;font-size:16px;text-decoration:none;min-height:48px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.danger{color:var(--tomato)}
.btn.magic{width:100%;background:var(--butter);border-color:var(--butter);color:var(--butter-ink);font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:19px;margin-top:16px}
.linkbtn{border:0;background:none;color:var(--basil);font-weight:700;padding:0;text-decoration:underline}
.savelink{display:block;margin-top:12px}
.iconbtn{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.iconbtn.sm{width:38px;height:38px;font-size:17px}
.heart[aria-pressed=true]{color:var(--tomato);border-color:var(--tomato)}
.fav{color:var(--tomato)}
.hsvg{width:20px;height:20px;display:block}
.favmark{position:absolute;top:13px;right:14px;color:var(--tomato)}
.favmark .hsvg{width:16px;height:16px}
.ta .hsvg{width:14px;height:14px;display:inline-block;vertical-align:-2px;color:var(--tomato);margin-left:6px}
.prefs{border-top:1px solid var(--line);margin-top:14px;padding-top:2px}
.iconbtn[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.heart[aria-pressed=true]{background:var(--surface)!important;color:var(--tomato)!important;border-color:var(--tomato)!important}
.row{display:flex;gap:10px;margin-top:22px}
.row .btn{flex:1}

.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--chip);border-radius:14px;padding:4px;margin:4px 0 12px}
.modes button{border:0;background:transparent;border-radius:11px;padding:9px 6px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:15px;color:var(--muted)}
.modes button[aria-pressed=true]{background:var(--surface);color:var(--basil);box-shadow:0 1px 3px rgba(0,0,0,.14)}

.weekhead{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.weekhead .wh{flex:1;text-align:center}
.weekhead h1{font-size:30px;font-weight:800;margin:0;line-height:1.05}
.weekhead small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.weekhead .linkbtn{font-size:14px}

.day{position:relative;display:flex;align-items:stretch;width:100%;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:16px;margin-bottom:10px}
.dayopen{flex:1;min-width:0;display:grid;grid-template-columns:58px 1fr;gap:12px;text-align:left;background:none;border:0;border-radius:16px;padding:14px 4px 14px 12px}
.grip{flex:none;width:38px;display:flex;align-items:center;justify-content:center;color:var(--muted);opacity:.6;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.grip .hsvg{width:18px;height:18px}
.day.shift{transition:transform .16s ease}
.day.dragging{z-index:8;box-shadow:0 12px 28px rgba(10,20,15,.25);cursor:grabbing}
.day.dragging .grip{opacity:1;color:var(--basil)}
.day.today{border-left-color:var(--basil)}
.day[data-status=leftovers]{border-left-color:var(--plum)}
.day[data-status=out]{border-left-color:var(--tomato)}
.day[data-status=order]{border-left-color:var(--amber)}
.dname{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px;line-height:1}
.today .dname{color:var(--basil)}
.ddate{color:var(--muted);font-size:13px;margin-top:5px}

function chooseMeal(k,i,used){

  const p=P().prefs,base=poolFoods(planKey());
  if(!base.length)return null;
  const prevK=key(addDays(parseKey(k),-7)),prev=new Set((P().weeks[prevK]?.days||[]).map(d=>d.main).filter(Boolean));
  const regs=new Set([0,1,2,3,4,5,6].filter(j=>j!==i).map(j=>regFood(j)).filter(Boolean)),fr=m=>!used.has(m.id)&&!regs.has(m.id);
  const tiers=[m=>fr(m)&&(!p.noRepeat||!prev.has(m.id)),fr,m=>!used.has(m.id),()=>true];
  for(const f of tiers){const c=base.filter(f);if(c.length)return weightedPick(c,favW).id}
  return null;
}
function runMagic(){
  if(!poolFoods(planKey()).length&&!Object.keys(P().regulars).length){toast('Turn on some meals for Magic to pick from');return}
  const k=key(ui.week),mg=MG();
  const targets=[0,1,2,3,4,5,6].filter(i=>mg.mode==='all'||(mg.mode==='nonregular'&&!regFood(i))||(mg.mode==='pick'&&mg.days[i]));
  if(!targets.length){toast('Pick at least one day');return}
  const used=new Set();
  for(let i=0;i<7;i++){const d=getDay(k,i);if(d.main&&!(targets.includes(i)&&!mg.keep))used.add(d.main)}
  const filled=[];let missed=0;
  for(const i of targets){
    const d=getDay(k,i);
    if(mg.keep&&(d.main||d.status!=='cook'))continue;
    const id=chooseMeal(k,i,used);
    if(!id){missed++;continue}
    used.add(id);
    setDay(k,i,x=>{if(x.main!==id)x.sides=[];x.main=id;x.status='cook'});
    filled.push(i);
  }
  ui.sheets=[];renderSheet();ui.flash=filled;render();
  if(!filled.length)toast(missed?'Nothing matches your preferences. Loosen them in Magic settings.':'Every day is already planned');
  else if(missed)toast('Some days had no matching foods and stayed empty');
}

function lunchCtx(k,skip,kid=ui.kid){
  const prevDays=S.lunchPlans[kid]?.[key(addDays(parseKey(k),-7))]?.days||[];
  const prev=new Set(prevDays.map(d=>d.lunch?.main).filter(Boolean)),used=new Set(),treatDays=new Set();
  for(const i of lDays()){
    if(i===skip)continue;
    const d=getLDay(k,i,kid);if(d.status!=='pack')continue;
    if(d.lunch.main)used.add(d.lunch.main);
    if(hasTreat(dayFoods(d)))treatDays.add(i);
  }
  return{prev,used,treatDays};
}
function treatTest(ctx,i){const limit=S.lunchPrefs.treats==='any'?Infinity:+S.lunchPrefs.treats;return ids=>!hasTreat(ids)||ctx.treatDays.has(i)||ctx.treatDays.size<limit}
function pickN(pool,n,ok,prefer){
  const out=[];let treat=false;
  const can=m=>!out.includes(m.id)&&(notTreat(m)||(!treat&&ok([m.id])));
  for(const g of prefer){if(out.length>=n)break;const c=pool.filter(m=>has(m,g)&&notTreat(m)&&can(m));if(c.length)out.push(weightedPick(c,favW).id)}
  while(out.length<n){const c=pool.filter(can);if(!c.length)break;const x=weightedPick(c,favW);out.push(x.id);if(!notTreat(x))treat=true}
  return out;
}
function buildLunch(ctx,ok,i,useReg=true){
  const all=named();
  const rf=useReg&&i!=null?regFood(i,'lunch'):null;
  if(rf){let pool=all.filter(m=>isSide(m)&&has(m,'lunch')&&m.id!==rf);if(!pool.length)pool=all.filter(m=>m.id!==rf&&['fruit','vegetable'].some(g=>has(m,g)));return{main:rf,sides:pickN(pool,S.lunchPrefs.sides,ok,['fruit','vegetable'])}}
  const ms=poolFoods('lunch');
  if(!ms.length)return null;
  let main=null;
  const regs=new Set([0,1,2,3,4,5,6].filter(j=>j!==i).map(j=>regFood(j,'lunch')).filter(Boolean)),fr=m=>!ctx.used.has(m.id)&&!regs.has(m.id);
  for(const f of[m=>fr(m)&&(!S.lunchPrefs.noRepeat||!ctx.prev.has(m.id)),fr,m=>!ctx.used.has(m.id),()=>true]){const c=ms.filter(f);if(c.length){main=weightedPick(c,favW);break}}

  if(!pool.length)pool=all.filter(m=>m.id!==main.id&&['fruit','vegetable'].some(g=>has(m,g)));

}
function buildSnack(ok){

  if(!pool.length)pool=all.filter(m=>['salty','fruit','vegetable','dairy','crunchy'].some(g=>has(m,g)));

function runLunchMagic(){
  if(!named().length){toast('Add some foods to your library first');return}
  const k=key(ui.week),mg=LMG(),doL=!snacksOn()||mg.what!=='snack',doS=snacksOn()&&mg.what!=='lunch';
  const targets=lDays().filter(i=>mg.mode==='all'||(mg.mode==='nonregular'&&!regFood(i,'lunch'))||(mg.mode==='pick'&&mg.days[i]));
  if(!targets.length){toast('Pick at least one day');return}
  const kids=mg.allKids&&S.kids.length>1?S.kids.map(x=>x.id):[ui.kid];
  const filled=[];let any=false,missing=false;
  for(const kid of kids){
    if(!mg.keep)for(const i of targets)setLDay(k,i,d=>{d.status='pack';if(doL)d.lunch={main:null,sides:[]};if(doS)d.snack={items:[]}},kid);
    for(const i of targets){

      }

function toggle(arr,v){const j=arr.indexOf(v);if(j<0)arr.push(v);else arr.splice(j,1)}
function addTag(raw){const t=raw.trim().toLowerCase();if(!t)return null;if(!S.tags.includes(t))S.tags.push(t);return t}

const acts={
  mode(el){ui.mode=el.dataset.v;try{localStorage.setItem(LSMODE,ui.mode)}catch(e){}ui.sheets=[];renderSheet();render();window.scrollTo(0,0)},

  deltag(el){const t=el.dataset.t;ask('Remove the '+t+' tag?','It comes off every food that has it.','Remove',()=>{S.tags=S.tags.filter(x=>x!==t);for(const m of Object.values(S.meals))m.tags=m.tags.filter(x=>x!==t);for(const pl of[S,S.bfast]){pl.prefs.require=pl.prefs.require.filter(x=>x!==t);pl.prefs.exclude=pl.prefs.exclude.filter(x=>x!==t);for(const[i,v]of Object.entries(pl.regulars))if(v==='t:'+t)delete pl.regulars[i]}ui.lib.tags=ui.lib.tags.filter(x=>x!==t);save();render()})},
  addtag(){if(addTag($('#setuptag').value)){save();render()}},

  openlday(el){ui.sheets=[{type:'lday',k:key(ui.week),i:+el.dataset.i,also:[]}];renderSheet()},

  rmlmain(){const s=topSheet();setLDay(s.k,s.i,d=>{d.lunch.main=null});renderSheet();render();$('#lmainin')?.focus()},
  rmlitem(el){const s=topSheet(),j=+el.dataset.j;setLDay(s.k,s.i,d=>{if(el.dataset.part==='sides')d.lunch.sides.splice(j,1);else d.snack.items.splice(j,1)});renderSheet();render()},
  rollpart(el){
    const s=topSheet(),part=el.dataset.part;
    if(!named().length){toast('Add some foods to your library first');return}

    if(hasTreat(part==='lunch'?d.snack.items:[d.lunch.main,...d.lunch.sides]))ctx.treatDays.add(s.i);
    if(part==='lunch'&&d.lunch.main)ctx.used.add(d.lunch.main);
    const r=part==='lunch'?buildLunch(ctx,treatTest(ctx,s.i),s.i,d.lunch.main!==regFood(s.i,'lunch')):buildSnack(treatTest(ctx,s.i));

  clearlday(){const s=topSheet();setLDay(s.k,s.i,d=>Object.assign(d,blankLDay()));renderSheet();render()},
  lmagic(){ui.sheets=[{type:'lmagic'}];renderSheet()},

  lmgwhat(el){LMG().what=el.dataset.v;save();renderSheet()},
  runlmagic(){runLunchMagic()},
  step(el){const k=el.dataset.k,lim=k==='sides'?[0,5]:[1,4];S.lunchPrefs[k]=Math.max(lim[0],Math.min(lim[1],S.lunchPrefs[k]+ +el.dataset.d));save();refresh()},

  pickkid(el){setKid(el.dataset.id);render()},
  openkid(el){ui.sheets=[{type:'kid',id:el.dataset.id}];renderSheet()},
  newkid(){const kd={id:uidGen('k'),name:'',color:0};S.kids.push(kd);save();setKid(kd.id);ui.sheets=[{type:'kid',id:kd.id,isNew:true}];renderSheet();render()},
  delkid(){const s=topSheet(),kd=S.kids.find(k=>k.id===s.id);ask('Remove '+kd.name+'?','Their lunch plans are deleted too. The food library stays.','Remove',()=>{S.kids=S.kids.filter(k=>k!==kd);delete S.lunchPlans[kd.id];ensureKid();setKid(ui.kid);save();ui.sheets=[];render()})},
  copyweek(){ui.sheets=[{type:'copy',from:ui.kid,k:key(ui.week),to:S.kids.length===2?S.kids.filter(k=>k.id!==ui.kid).map(k=>k.id):[]}];renderSheet()},
  copyto(el){toggle(topSheet().to,el.dataset.id);renderSheet()},
  runcopy(){
    const s=topSheet();if(!s.to.length){toast('Pick a kid to copy to');return}
    for(const kid of s.to)for(let i=0;i<7;i++){const src=JSON.parse(JSON.stringify(getLDay(s.k,i,s.from)));setLDay(s.k,i,d=>Object.assign(d,src),kid)}
    const names=s.to.map(id=>S.kids.find(k=>k.id===id)?.name).filter(Boolean);
    ui.sheets=[];renderSheet();setKid(s.to[0]);ui.week=parseKey(s.k);ui.flash=lDays();render();
    toast('Copied to '+names.join(' and ')+'. Tap a day to adjust.');
  },

  fbconnect(){const raw=$('#fbcfg').value,cfg=parseConfig(raw);if(!cfg){const t=String(raw).replace(/[\u201C\u201D\u2018\u2019]/g,'"'),found=['apiKey','authDomain','projectId','appId'].filter(k=>new RegExp(k+'["\']?\\s*:').test(t));$('#fbmsg').textContent=raw.trim()?`Couldn't read the config. Found ${found.length?found.join(', '):'none of the expected fields'} in ${raw.length} characters. It needs apiKey and projectId, each with a value in quotes.`:'The config box is empty. Paste the firebaseConfig block first.';return}const hh=($('#fbhh').value||'home').trim().toLowerCase().replace(/[^a-z0-9-]+/g,'-').replace(/^-+|-+$/g,'')||'home';try{localStorage.setItem(LSSYNC,JSON.stringify({config:cfg,household:hh}))}catch(e){}startSync();refreshSync()},
  fbemailin(){if(!window.firebase||!firebase.auth){toast('Still connecting. Try again in a moment.');return}const em=$('#fbemail').value.trim(),pw=$('#fbpass').value;if(!em||!pw){fb.msg='Enter your email and password.';refreshSync();return}fb.msg='';firebase.auth().signInWithEmailAndPassword(em,pw).catch(e=>{fb.msg=authMsg(e);refreshSync();const f=$('#fbemail');if(f)f.value=em})},
  fbreset(){if(!window.firebase||!firebase.auth)return;const em=($('#fbemail')?.value||'').trim();if(!em){fb.msg='Type your email above first, then tap Forgot password.';refreshSync();return}firebase.auth().sendPasswordResetEmail(em).then(()=>toast('Reset email sent. Check your inbox.')).catch(e=>{fb.msg=authMsg(e);refreshSync()})},
  fbsignin(){if(!window.firebase||!firebase.auth){toast('Still connecting. Try again in a moment.');return}const pr=new firebase.auth.GoogleAuthProvider();firebase.auth().signInWithPopup(pr).catch(e=>{if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')firebase.auth().signInWithRedirect(pr);else{fb.msg=authMsg(e);refreshSync()}})},
  fbsignout(){if(window.firebase&&firebase.auth)firebase.auth().signOut()},
  fbremove(){ask('Disconnect this phone?','This phone stops syncing and keeps a copy of the current plan. The household plan stays in Firebase.','Disconnect',()=>{stopDoc();try{if(window.firebase&&firebase.auth)firebase.auth().signOut()}catch(e){}try{localStorage.removeItem(LSSYNC)}catch(e){}fb.state='off';fb.user=null;fb.msg='';ui.sheets=[];render()})},
  joinremote(){const s=topSheet();markJoined();ui.sheets=[];renderSheet();applyRemote(s.r,true);toast('Joined the household plan')},
  joinlocal(){markJoined();ui.sheets=[];renderSheet();save();pushRemote(true);toast('Household plan replaced with this phone')},

document.addEventListener('click',e=>{
  const tab=e.target.closest('[data-tab]');
  if(tab){ui.tab=tab.dataset.tab;ui.sheets=[];renderSheet();render();window.scrollTo(0,0);return}
  const el=e.target.closest('[data-act]');
  if(el&&acts[el.dataset.act]){e.preventDefault();acts[el.dataset.act](el)}
});
document.addEventListener('input',e=>{
  const ds=e.target.dataset||{},s=topSheet();if(!s)return;
  if(ds.f&&s.type==='meal'){const m=S.meals[s.id];if(!m)return;m[ds.f]=e.target.value;save();if(ds.f==='link'){const a=$('#mopen');if(a){a.hidden=!m.link.trim();a.href=m.link.trim()?href(m.link):'#'}}}
  if(ds.fk&&s.type==='kid'){const kd=S.kids.find(k=>k.id===s.id);if(kd){kd.name=e.target.value;save()}}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.reg!==undefined){const regs=regsOf(t.dataset.regm||ui.mode);if(t.value)regs[t.dataset.reg]=t.value;else delete regs[t.dataset.reg];save();return}
  if(t.dataset&&t.dataset.starter!==undefined){const s=topSheet();if(s&&s.sel){toggle(s.sel,+t.dataset.starter);renderSheet()}return}
  if(t.dataset&&t.dataset.also){const s=topSheet();if(s&&s.also)toggle(s.also,t.dataset.also);return}
  const set={pseason:v=>P().prefs.season=v,prepeat:v=>P().prefs.noRepeat=v,lprepeat:v=>S.lunchPrefs.noRepeat=v,lweekends:v=>S.lunchPrefs.weekends=v,lschool:v=>S.lunchPrefs.schoolLunch=v,lsnacks:v=>S.lunchPrefs.snacks=v};
  if(set[t.id]){set[t.id](t.checked);save();refresh();return}
  if(t.id==='ltreats'){S.lunchPrefs.treats=t.value==='any'?'any':+t.value;save();refresh();return}
  if(t.id==='mgkeep'){MG().keep=t.checked;save();return}
  if(t.id==='lmgkeep'){LMG().keep=t.checked;save();return}
  if(t.id==='lmgall'){LMG().allKids=t.checked;save();return}
  if(t.dataset&&t.dataset.pool){const pl=S.magicPools[t.dataset.m];toggle(pl.off,t.dataset.pool);save();refresh();return}
  if(t.id==='impfile'&&t.files&&t.files[0]){t.files[0].text().then(restore);t.value=''}
});
function reorderDays(from,to){
  const k=key(ui.week),cl=o=>JSON.parse(JSON.stringify(o));
  if(ui.mode==='lunch'){
    const idx=lDays(),c=idx.map(i=>{const d=getLDay(k,i);return cl({status:d.status,lunch:d.lunch,snack:d.snack})});
    c.splice(to,0,c.splice(from,1)[0]);idx.forEach((i,j)=>setLDay(k,i,d=>Object.assign(d,c[j])));ui.flash=[idx[to]];
  }else{
    const c=[0,1,2,3,4,5,6].map(i=>{const d=getDay(k,i);return cl({status:d.status,main:d.main,sides:d.sides})});
    c.splice(to,0,c.splice(from,1)[0]);c.forEach((x,i)=>setDay(k,i,d=>Object.assign(d,x)));ui.flash=[to];
  }
  render();
}
let drag=null;
document.addEventListener('pointerdown',e=>{
  const g=e.target.closest('[data-grip]');if(!g||ui.tab!=='week'||ui.sheets.length)return;
  e.preventDefault();
  const card=g.closest('.day'),cards=[...document.querySelectorAll('#app .day')],from=cards.indexOf(card);
  const rects=cards.map(c=>c.getBoundingClientRect());
  drag={card,cards,from,to:from,rects,id:e.pointerId,y0:e.clientY,s0:window.scrollY,lastY:e.clientY};
  cards.forEach(c=>{c.classList.remove('pop');c.style.animation='none'});
  card.classList.add('dragging');cards.forEach(c=>{if(c!==card)c.classList.add('shift')});
  try{g.setPointerCapture(e.pointerId)}catch(_){}
  const tick=()=>{if(!drag)return;const y=drag.lastY;if(y<90)window.scrollBy(0,-10);else if(y>window.innerHeight-150)window.scrollBy(0,10);moveDrag();drag.raf=requestAnimationFrame(tick)};
  drag.raf=requestAnimationFrame(tick);
});
function moveDrag(){
  const d=drag,dy=d.lastY-d.y0+(window.scrollY-d.s0),r=d.rects[d.from],gap=10,hgt=r.height+gap;
  d.card.style.transform=`translateY(${dy}px) scale(1.02)`;
  const mid=r.top+r.height/2+dy;
  let to=d.from;
  d.rects.forEach((q,j)=>{const c=q.top+q.height/2;if(j<d.from&&mid<c)to=Math.min(to,j);if(j>d.from&&mid>c)to=Math.max(to,j)});
  d.to=to;
  d.cards.forEach((c,j)=>{if(j===d.from)return;let t=0;if(d.from<to&&j>d.from&&j<=to)t=-hgt;else if(to<d.from&&j>=to&&j<d.from)t=hgt;c.style.transform=t?`translateY(${t}px)`:''});
}
document.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;e.preventDefault();drag.lastY=e.clientY;moveDrag()},{passive:false});
function endDrag(e){
  if(!drag||(e&&e.pointerId!==drag.id))return;
  cancelAnimationFrame(drag.raf);
  const{from,to,cards}=drag;drag=null;
  cards.forEach(c=>{c.style.transform='';c.classList.remove('shift','dragging')});
  if(to!==from)reorderDays(from,to);
}
document.addEventListener('animationend',e=>{if(e.target.classList&&e.target.classList.contains('pop')){e.target.classList.remove('pop');e.target.style.animationDelay=''}});
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);
const ENTER={fbpass:'fbemailin',newtag:'addtagmeal',setuptag:'addtag',presetname:'savepreset'};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&ui.sheets.length){closeSheet();return}
  if(e.key==='Enter'&&ENTER[e.target.id]){e.preventDefault();acts[ENTER[e.target.id]]()}
});
render();
startSync();
